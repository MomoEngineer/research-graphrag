[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-graphrag"
version = "0.1.0"
description = "Schlanker, container-freier Scientific-GraphRAG als persönlicher Forschungsassistent für lokale wissenschaftliche PDF-Paper, nutzbar aus GitHub Copilot über einen MCP-Server (stdio)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# ---------------------------------------------------------------------------
# Kern-Laufzeitabhängigkeiten mit exakten Pins (Reproduzierbarkeit).
#
# Der Index-Bau folgt dem Offline-Hybrid (Option B, siehe
# docs/adr/0005-graphrag-index-backend-open.md): pypdf (Extraktion), scikit-learn
# (TF-IDF), networkx (Graph + Louvain), SQLite (stdlib). Alle Pins sind in der
# WinPython-Basis vorhanden, sodass `pip install -e .` offline durchläuft
# (siehe docs/adr/0002-venv-and-offline-dependency-strategy.md). Der MS-GraphRAG-
# Stack (docling/graphrag/lancedb) ist offline nicht beschaffbar und daher NICHT
# Teil der Abhängigkeiten (ADR 0005).
# ---------------------------------------------------------------------------
dependencies = [
    "mcp==1.21.0",
    "pypdf==5.6.0",
    "scikit-learn==1.8.0",
    "networkx==3.6.1",
]

[project.optional-dependencies]
# Entwicklungswerkzeuge mit exakten Pins. Diese Versionen sind in der
# WinPython-Basis vorhanden. Bewusst NICHT enthalten sind pytest-cov/coverage und
# pytest-asyncio – sie sind offline nicht installierbar; die Ersatzstrategie steht
# in docs/adr/0003-offline-test-and-coverage-tooling.md. reportlab dient nur der
# Erzeugung von PDF-Test-Fixtures.
dev = [
    "ruff==0.14.7",
    "mypy==1.19.0",
    "pytest==8.4.1",
    "anyio==4.12.0",
    "reportlab==4.4.2",
    "hypothesis==6.148.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_graphrag*"]

# ---------------------------------------------------------------------------
# Ruff (Linting + Formatierung)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "N"]

[tool.ruff.lint.per-file-ignores]
# Tests dürfen assert-Vielfalt und lange Beispiel-Zeilen enthalten.
"tests/**" = ["E501"]

# ---------------------------------------------------------------------------
# mypy (statische Typprüfung)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Der mcp-Client stellt teils dynamische Attribute bereit.
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn / scipy / networkx liefern offline keine vollständigen Typstubs.
module = ["sklearn.*", "scipy.*", "networkx.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "anyio: markiert asynchrone Tests (ausgeführt über das anyio-Pytest-Plugin).",
]
filterwarnings = [
    # Dritt-Warnung aus dateutil (via reportlab); nicht unser Code.
    "ignore:.*utcfromtimestamp.*:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage (Konfiguration für den Moment, in dem coverage/pytest-cov verfügbar
# werden – siehe docs/adr/0003-offline-test-and-coverage-tooling.md). Bis dahin
# misst scripts/coverage_offline.py die Zeilenabdeckung über die stdlib.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/research_graphrag"]

[tool.coverage.report]
fail_under = 80
show_missing = true
